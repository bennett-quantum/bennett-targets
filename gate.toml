# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-targets"
tool_sha = "01c0314c9aaa4a37313ab530da2134efafe9cbd5"
timeout_s = 7200

[env]
BENNETT_GATE_LAYOUT = "{layout}"
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
CARGO_BUILD_JOBS = "3"
RUST_TEST_THREADS = "4"

[[check]]
name = "fmt"
argv = ["cargo", "fmt", "--manifest-path", "validator/Cargo.toml", "--", "--check"]

[[check]]
name = "clippy"
argv = ["cargo", "clippy", "--offline", "--manifest-path", "validator/Cargo.toml", "--all-targets", "--", "-D", "warnings"]

[[check]]
name = "test"
argv = ["cargo", "test", "--offline", "--manifest-path", "validator/Cargo.toml"]

[[check]]
name = "build"
argv = ["cargo", "build", "--offline", "--manifest-path", "validator/Cargo.toml"]

[[check]]
name = "pin-resolver"
argv = ["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_*.py"]

[[check]]
name = "quality-baseline"
argv = ["python3", "scripts/quality_ratchet.py"]

[[check]]
name = "verify"
argv = ["python3", "scripts/verify.py"]

[siblings."bennett-isa-spec"]
sha = "ecaaac060c44e317d1181345fa6b8e38c096c099"
note = "ISA main as gated by the 2026-11-02 push wave"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "3" }

[siblings."bennett-vm"]
sha = "d9cb68433c08f4db8f7d8c90f121a8adae51759b"
note = "VM main on origin"

[[siblings."bennett-vm".build]]
name = "vm binary"
argv = ["cargo", "build", "--offline"]
outputs = ["target/debug/bennett-vm"]
needs = ["bennett-isa-spec"]
env = { CARGO_BUILD_JOBS = "3" }

