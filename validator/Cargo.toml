[package]
name = "bennett-targets-validator"
version = "0.1.0"
edition = "2021"
description = "Validator for Bennett ISA-spec target descriptions (ISA 0.8)"
license-file = "../LICENSE"

[dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"
ryu-js = "1"
